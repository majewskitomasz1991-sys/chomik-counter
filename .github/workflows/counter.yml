name: Counter Update
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node generate.mjs
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add counter.png data.json
          git diff --staged --quiet || (git commit -m "update" && git push)
