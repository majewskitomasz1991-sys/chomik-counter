name: Counter Update
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Stats
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: |
          curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/traffic/views > traffic.json
          node -e "
          const fs=require('fs');
          try{
            const t=JSON.parse(fs.readFileSync('traffic.json','utf8'));
            const d=JSON.parse(fs.readFileSync('data.json','utf8'));
            if(t.count) d.views = t.count;
            if(t.uniques) d.uniques = t.uniques;
            fs.writeFileSync('data.json', JSON.stringify(d,null,2));
          }catch(e){}
          "
      - run: node generate.mjs
      - run: |
          git config user.name "counter-bot"
          git config user.email "bot@github.com"
          git add counter.png data.json
          git diff --staged --quiet || (git commit -m "update counter" && git push)
